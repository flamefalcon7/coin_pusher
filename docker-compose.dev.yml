# Development docker-compose with hot reload
services:
  # Shared package with watch mode (auto-rebuild on changes)
  shared:
    image: node:20-alpine
    container_name: coin-pusher-shared-dev
    working_dir: /app
    stop_grace_period: 0s
    restart: unless-stopped
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - coin-pusher-network
    command: sh -c "npm install -g pnpm && (pnpm install || true) && pnpm --filter @coin-pusher/shared build && pnpm --filter @coin-pusher/shared dev"

  # Development Server with hot reload
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: coin-pusher-dev
    stop_grace_period: 0s
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      # Mount source code for hot reload
      - ./server/src:/app/server/src:ro
      - ./shared/src:/app/shared/src:ro
      # Mount shared dist for access to compiled files
      - ./shared/dist:/app/shared/dist:ro
    networks:
      - coin-pusher-network
    depends_on:
      - shared
    command: pnpm --filter @coin-pusher/server dev

  # Client Dev Server (Vite)
  client:
    image: node:20-alpine
    container_name: coin-pusher-client-dev
    working_dir: /app
    stop_grace_period: 0s
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_WS_URL=ws://localhost:3000
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - coin-pusher-network
    depends_on:
      - shared
    command: sh -c "npm install -g pnpm && pnpm install && pnpm --filter @coin-pusher/client dev --host"

networks:
  coin-pusher-network:
    driver: bridge
