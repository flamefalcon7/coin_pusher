# Development docker-compose with hot reload
services:
  # Shared package with watch mode (auto-rebuild on changes)
  shared:
    image: node:20-alpine
    container_name: coin-pusher-shared-dev
    working_dir: /app
    stop_grace_period: 0s
    restart: unless-stopped
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - coin-pusher-network
    command: sh -c "npm install -g pnpm && (pnpm install || true) && pnpm --filter @coin-pusher/shared build && pnpm --filter @coin-pusher/shared dev"

  # Development Game Server with hot reload
  game:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: coin-pusher-game-dev
    stop_grace_period: 0s
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      # Mount source code for hot reload
      - ./game/src:/app/game/src:ro
      - ./shared/src:/app/shared/src:ro
      # Mount shared dist for access to compiled files
      - ./shared/dist:/app/shared/dist:ro
    networks:
      - coin-pusher-network
    depends_on:
      - shared
    command: pnpm --filter @coin-pusher/game dev

  # Client Dev Server (Vite)
  client:
    image: node:20-alpine
    container_name: coin-pusher-client-dev
    working_dir: /app
    stop_grace_period: 0s
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_WS_URL=ws://localhost:3000
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - coin-pusher-network
    depends_on:
      - shared
    command: sh -c "npm install -g pnpm && pnpm install && pnpm --filter @coin-pusher/client dev --host"

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: coin-pusher-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=coinpusher
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - coin-pusher-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go backend API server
  backend:
    build:
      context: ./backend
      dockerfile: zarf/docker/Dockerfile.backend
    container_name: coin-pusher-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "4010:4010"
    environment:
      - BACKEND_DB_HOST=postgres:5432
      - BACKEND_DB_USER=postgres
      - BACKEND_DB_PASSWORD=postgres
      - BACKEND_DB_NAME=coinpusher
      - BACKEND_DB_DISABLE_TLS=true
      - BACKEND_AUTH_DEV_MODE=true
      - BACKEND_GAME_API_KEY=dev-secret
    networks:
      - coin-pusher-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

networks:
  coin-pusher-network:
    driver: bridge
