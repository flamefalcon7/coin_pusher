# Development docker-compose with hot reload
services:
  # Shared package with watch mode (auto-rebuild on changes)
  shared:
    image: node:20-alpine
    container_name: coin-pusher-shared-dev
    working_dir: /app
    stop_grace_period: 0s
    restart: unless-stopped
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - coin-pusher-network
    command: sh -c "npm install -g pnpm && (pnpm install || true) && pnpm --filter @coin-pusher/shared build && pnpm --filter @coin-pusher/shared dev"

  # NATS message queue
  nats:
    image: nats:2.10-alpine
    container_name: coin-pusher-nats
    restart: unless-stopped
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    command: ["--http_port", "8222"]
    networks:
      - coin-pusher-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Development Game Server with hot reload
  game:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: coin-pusher-game-dev
    stop_grace_period: 0s
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NATS_URL=nats://nats:4222
    volumes:
      # Mount source code for hot reload
      - ./game/server/src:/app/game/server/src:ro
      - ./game/shared/src:/app/game/shared/src:ro
      # Mount shared dist for access to compiled files
      - ./game/shared/dist:/app/game/shared/dist:ro
    networks:
      - coin-pusher-network
    depends_on:
      shared:
        condition: service_started
      nats:
        condition: service_healthy
    command: pnpm --filter @coin-pusher/game dev

  # Client Dev Server (Vite)
  client:
    image: node:20-alpine
    container_name: coin-pusher-client-dev
    working_dir: /app
    stop_grace_period: 0s
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - coin-pusher-network
    depends_on:
      - shared
    command: sh -c "npm install -g pnpm && pnpm install && pnpm --filter @coin-pusher/client dev --host"

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: coin-pusher-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=coinpusher
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/zarf/docker/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/zarf/docker/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - coin-pusher-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go backend API server
  backend:
    build:
      context: ./backend
      dockerfile: zarf/docker/Dockerfile.backend
    container_name: coin-pusher-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "4010:4010"
    environment:
      - BACKEND_DB_HOST=postgres:5432
      - BACKEND_DB_USER=postgres
      - BACKEND_DB_PASSWORD=postgres
      - BACKEND_DB_NAME=coinpusher
      - BACKEND_DB_DISABLE_TLS=true
      - BACKEND_AUTH_DEV_MODE=true
      - BACKEND_GAME_API_KEY=dev-secret
      - BACKEND_NATS_URL=nats://nats:4222
      - IDLE_TEST=${IDLE_TEST:-0}
    networks:
      - coin-pusher-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  pgdata:

networks:
  coin-pusher-network:
    driver: bridge
