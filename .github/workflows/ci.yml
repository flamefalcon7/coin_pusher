name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ts-tests:
    name: TypeScript tests (client / server / shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads pnpm version from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r test

      # Dead-code gate: unused files/dependencies fail, unused exports only warn (knip.jsonc)
      - run: pnpm knip

  go-tests:
    name: Go tests (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go vet ./...

      # Integration tests self-skip when OUTBOX_TEST_PG_DSN etc. are unset,
      # so this runs unit tests only — no services required.
      - run: go test ./...
