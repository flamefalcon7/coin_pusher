name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ts-tests:
    name: TypeScript tests (client / server / shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads pnpm version from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r test

      # Dead-code gate: unused files/dependencies fail, unused exports only warn (knip.jsonc)
      - run: pnpm knip

  go-tests:
    name: Go tests (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go vet ./...

      # Integration tests self-skip when OUTBOX_TEST_PG_DSN etc. are unset,
      # so this runs unit tests only — no services required.
      - run: go test ./...

      # Dead-code gate (mirror of knip for TS). Tests and the integration tag count as roots.
      # Pinned to the x/tools version in the module cache; bump deliberately.
      - name: deadcode
        run: |
          out=$(go run golang.org/x/tools/cmd/deadcode@v0.41.0 -test -tags integration ./...)
          if [ -n "$out" ]; then echo "$out"; echo "::error::unreachable Go code found; delete it or wire it up"; exit 1; fi

  prom-rules:
    name: Alert PromQL tests (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rules/alerts.yml mirrors the Grafana-provisioned rules so their PromQL can be
      # unit-tested; Prometheus itself never loads it (Grafana unified alerting is live).
      # Same image as production (docker-compose.services.yml).
      - run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v2.51.0 check rules /p/rules/alerts.yml
          docker run --rm -v "$PWD/deploy/prometheus:/p:ro" -w /p --entrypoint promtool prom/prometheus:v2.51.0 test rules /p/tests/alerts_test.yml
