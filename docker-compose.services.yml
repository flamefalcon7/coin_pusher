# Services machine: backend API, database, NATS, nginx, indexer, executor
# Deploy to the services droplet alongside PostgreSQL and NATS.
# Game machine connects to NATS via VPC private IP on port 4222.

services:
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["--http_port", "8222"]
    ports:
      - "10.104.0.3:4222:4222"
    networks: [app]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: zarf/docker/Dockerfile.backend
    restart: unless-stopped
    expose:
      - "4000"
      - "4010"
    environment:
      BACKEND_DB_HOST: postgres:5432
      BACKEND_DB_USER: ${DB_USER}
      BACKEND_DB_PASSWORD: ${DB_PASSWORD}
      BACKEND_DB_NAME: ${DB_NAME}
      BACKEND_DB_DISABLE_TLS: "true"
      BACKEND_NATS_URL: nats://nats:4222
      BACKEND_AUTH_DEV_MODE: "false"
      BACKEND_AUTH_KEYS_FOLDER: /app/zarf/keys
      BACKEND_WEB_CORS_ORIGINS: ${CORS_ORIGINS}
      BACKEND_GAME_API_KEY: ${GAME_API_KEY}
      BACKEND_WALLET_SEED: ${WALLET_SEED}
    command: sh -c "/bin/admin migrate && /bin/admin bot seed && /bin/api"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }
    networks: [app]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  executor:
    build:
      context: ./backend
      dockerfile: zarf/docker/Dockerfile.backend
    restart: unless-stopped
    expose:
      - "9092"
    command: ["/bin/executor"]
    environment:
      BACKEND_DB_HOST: postgres:5432
      BACKEND_DB_USER: ${DB_USER}
      BACKEND_DB_PASSWORD: ${DB_PASSWORD}
      BACKEND_DB_NAME: ${DB_NAME}
      BACKEND_DB_DISABLE_TLS: "true"
      BACKEND_WALLET_SEED: ${WALLET_SEED}
      # Executor uses multi-provider RPC fallback. Write-path (SendTransaction)
      # deliberately excludes public RPC — dropped/stuck broadcasts on a shared
      # public endpoint are worse than a brief outage. Both vars must be set.
      BACKEND_EXECUTOR_RPCURLS: "${ALCHEMY_RPC_URL:-},${ANKR_RPC_URL:-}"
      BACKEND_EXECUTOR_RPC_TIMEOUT: ${EXECUTOR_RPC_TIMEOUT:-3s}
      BACKEND_EXECUTOR_USDC_CONTRACT: ${EXECUTOR_USDC_CONTRACT:-0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [app]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  indexer:
    build:
      context: ./backend
      dockerfile: zarf/docker/Dockerfile.backend
    restart: unless-stopped
    expose:
      - "9091"
    command: ["/bin/indexer"]
    environment:
      BACKEND_DB_HOST: postgres:5432
      BACKEND_DB_USER: ${DB_USER}
      BACKEND_DB_PASSWORD: ${DB_PASSWORD}
      BACKEND_DB_NAME: ${DB_NAME}
      BACKEND_DB_DISABLE_TLS: "true"
      BACKEND_WALLET_SEED: ${WALLET_SEED}
      # Indexer uses multi-provider RPC fallback. Read-only, so public RPC
      # first is fine and spares Alchemy/Ankr quota.
      BACKEND_INDEXER_RPCURLS: "${BASE_PUBLIC_RPC_URL:-https://mainnet.base.org},${ALCHEMY_RPC_URL:-},${ANKR_RPC_URL:-}"
      BACKEND_INDEXER_RPC_TIMEOUT: ${INDEXER_RPC_TIMEOUT:-3s}
      BACKEND_INDEXER_USDC_CONTRACT: ${INDEXER_USDC_CONTRACT:-0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913}
      BACKEND_INDEXER_BLOCK_RANGE: ${INDEXER_BLOCK_RANGE:-50}
      BACKEND_INDEXER_POLL_INTERVAL: ${INDEXER_POLL_INTERVAL:-2s}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [app]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend: { condition: service_started }
      grafana: { condition: service_started }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/.htpasswd:/etc/nginx/conf.d/.htpasswd:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks: [app]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [app]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    environment:
      GF_SERVER_DOMAIN: "${GRAFANA_DOMAIN:-localhost}"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-https://localhost/grafana/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-admin}"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [app]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

networks:
  app:
    driver: bridge
