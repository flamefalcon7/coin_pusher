# Full stack with Nginx (optional - use if deploying client on same server)
# For most cases, use Cloudflare Pages for client and docker-compose.yml for server

services:
  # Game Server
  game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coin-pusher-game
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - coin-pusher-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: coin-pusher-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./game/client/dist:/var/www/html:ro
      # Uncomment if using SSL certificates
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - game
    networks:
      - coin-pusher-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  coin-pusher-network:
    driver: bridge

