apiVersion: 1

groups:
  - orgId: 1
    name: P0 - Critical
    folder: Alerts
    interval: 1m
    rules:
      - uid: p0-api-down
        title: "P0: API server down"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="backend"} == 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 1m
        labels:
          severity: P0
        annotations:
          summary: "API server is DOWN"
        noDataState: OK

      - uid: p0-game-down
        title: "P0: Game server down"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="game"} == 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 1m
        labels:
          severity: P0
        annotations:
          summary: "Game server is DOWN"
        noDataState: OK

      - uid: p0-db-pool
        title: "P0: DB pool exhausted"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: coinpusher_db_pool_in_use / coinpusher_db_pool_max_open > 0.9
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 2m
        labels:
          severity: P0
        annotations:
          summary: "DB connection pool >90% utilized"
        noDataState: OK

      - uid: p0-nats-disconnect
        title: "P0: NATS disconnected"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(coinpusher_nats_disconnects_total[2m]) > 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        labels:
          severity: P0
        annotations:
          summary: "NATS connection lost"
        noDataState: OK

      - uid: p0-indexer-lag
        title: "P0: Indexer block lag >100"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: coinpusher_indexer_block_lag > 100
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P0
        annotations:
          summary: "Indexer is >100 blocks behind chain tip"
        noDataState: OK

      - uid: p0-executor-failures
        title: "P0: Executor consecutive failures"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(coinpusher_executor_withdrawals_failed_total[10m]) > 5
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        labels:
          severity: P0
        annotations:
          summary: "Executor has >5 failed withdrawals in 10min"
        noDataState: OK

      # --- NEW P0 rules ---

      - uid: p0-batch-insert-refund-fail
        title: "P0: Batch insert refund failure (funds lost)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(coinpusher_batch_insert_refund_failures_total[5m]) > 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        labels:
          severity: P0
        annotations:
          summary: "NATS publish failed AND refund failed — player coins permanently lost"
        noDataState: OK

      - uid: p0-withdrawal-refund-fail
        title: "P0: Withdrawal refund failure (funds stuck)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(coinpusher_withdrawal_refund_errors_total[5m]) > 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        labels:
          severity: P0
        annotations:
          summary: "Failed to refund a failed withdrawal — user funds stuck in limbo"
        noDataState: OK

      - uid: p0-indexer-down
        title: "P0: Indexer stopped processing"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="indexer"} == 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 2m
        labels:
          severity: P0
        annotations:
          summary: "Indexer process is down — deposits will not be credited"
        noDataState: OK

      - uid: p0-executor-down
        title: "P0: Executor stopped processing"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="executor"} == 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 2m
        labels:
          severity: P0
        annotations:
          summary: "Executor process is down — withdrawals will not be processed"
        noDataState: OK

      - uid: p0-indexer-no-blocks
        title: "P0: Indexer zero blocks processed in 10m"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="indexer"} == 1 and increase(coinpusher_indexer_blocks_processed_total[10m]) == 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P0
        annotations:
          summary: "Indexer is running but not processing any blocks — possible RPC or DB issue"
        noDataState: OK

      - uid: p0-reward-flush-sustained
        title: "P0: Reward flush errors sustained >5m"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(coinpusher_reward_flush_errors_total[5m]) > 3
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P0
        annotations:
          summary: "Reward flush failing repeatedly — in-memory rewards accumulating and at risk of total loss on crash"
        noDataState: OK

      - uid: p0-rtp-global-anomaly
        title: "P0: Global RTP anomaly (>120% or <30%)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: coinpusher_rtp_ratio{window="1h"} > 1.2 or coinpusher_rtp_ratio{window="1h"} < 0.3
              instant: true
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        labels:
          severity: P0
        annotations:
          summary: "Global RTP ratio outside safe range — possible exploit or physics bug"
        noDataState: OK

      # --- RPC fallback health (added 2026-04-24) ---
      # These alerts fire when the multi-provider ethrpc client cannot
      # successfully complete any call — primary + all fallbacks failing.
      # Metric emitted by backend/foundation/ethrpc/.

      - uid: p0-indexer-rpc-all-down
        title: "P0: Indexer — ALL RPC providers failing"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              # `or on() vector(0)` ensures the ok-rate series exists even when
              # no ok-result samples have been produced yet (e.g., after a
              # fresh container restart), so the "0 ok AND >0 total" pattern
              # fires correctly instead of evaluating to empty.
              expr: (sum(rate(coinpusher_rpc_attempts_total{service="indexer"}[5m])) > 0) and ((sum(rate(coinpusher_rpc_attempts_total{service="indexer",result="ok"}[5m])) or on() vector(0)) == 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 2m
        labels:
          severity: P0
        annotations:
          summary: "Indexer: every RPC provider (public + Alchemy + Ankr) is returning errors. Deposits are NOT being indexed."
        noDataState: OK

      - uid: p0-executor-rpc-all-down
        title: "P0: Executor — ALL RPC providers failing"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: (sum(rate(coinpusher_rpc_attempts_total{service="executor"}[5m])) > 0) and ((sum(rate(coinpusher_rpc_attempts_total{service="executor",result="ok"}[5m])) or on() vector(0)) == 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 2m
        labels:
          severity: P0
        annotations:
          summary: "Executor: every RPC provider (Alchemy + Ankr) is returning errors. Withdrawals are stuck."
        noDataState: OK

  - orgId: 1
    name: P1 - Urgent
    folder: Alerts
    interval: 5m
    rules:
      - uid: p1-5xx-rate
        title: "P1: HTTP 5xx rate >5%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: rate(coinpusher_http_requests_total{status=~"5.."}[5m]) / rate(coinpusher_http_requests_total[5m]) > 0.05
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "HTTP 5xx error rate exceeds 5%"
        noDataState: OK

      - uid: p1-latency
        title: "P1: API latency p99 >2s"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.99, rate(coinpusher_http_request_duration_seconds_bucket[5m])) > 2
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "API p99 latency exceeds 2 seconds"
        noDataState: OK

      - uid: p1-ws-mass-disconnect
        title: "P1: WS mass disconnect >50%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: coinpusher_ws_connections_active < (coinpusher_ws_connections_active offset 5m) * 0.5
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        labels:
          severity: P1
        annotations:
          summary: "WebSocket connections dropped >50% in 5 minutes"
        noDataState: OK

      - uid: p1-tick-overrun
        title: "P1: Physics frame overrun p99 >33ms"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.99, rate(coinpusher_game_tick_duration_seconds_bucket[5m])) > 0.033
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Game tick p99 exceeds 33ms budget"
        noDataState: OK

      - uid: p1-reward-flush-errors
        title: "P1: Reward flush errors"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(coinpusher_reward_flush_errors_total[5m]) > 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        labels:
          severity: P1
        annotations:
          summary: "Reward flush encountered errors"
        noDataState: OK

      # --- NEW P1 rules ---

      - uid: p1-indexer-deposit-errors
        title: "P1: Deposit processing errors"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(coinpusher_indexer_deposit_errors_total[5m]) > 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        labels:
          severity: P1
        annotations:
          summary: "Deposit on-chain event detected but failed to credit user balance"
        noDataState: OK

      - uid: p1-executor-gas-high
        title: "P1: Gas price too high for >30m"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: coinpusher_executor_gas_price_gwei > 5
              instant: true
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 30m
        labels:
          severity: P1
        annotations:
          summary: "Gas price exceeds max threshold for >30m — all withdrawals/sweeps blocked"
        noDataState: OK

      - uid: p1-ws-snapshot-timeout
        title: "P1: WS snapshot timeouts"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(coinpusher_ws_snapshot_timeout_total[5m]) > 3
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        labels:
          severity: P1
        annotations:
          summary: "Multiple WS snapshot timeouts — new players joining see empty game state"
        noDataState: OK

      - uid: p1-auth-brute-force
        title: "P1: Auth failure spike (brute force)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(coinpusher_auth_failures_total[5m]) > 50
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        labels:
          severity: P1
        annotations:
          summary: "Auth failures >50 in 5min — possible credential stuffing or brute force attack"
        noDataState: OK

      - uid: p1-executor-rpc-latency
        title: "P1: Executor RPC latency >5s"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.99, rate(coinpusher_executor_rpc_latency_seconds_bucket[5m])) > 5
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Executor RPC latency p99 >5s — Base chain RPC degraded"
        noDataState: OK

      - uid: p1-indexer-rpc-latency
        title: "P1: Indexer RPC latency >5s"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.99, rate(coinpusher_indexer_rpc_latency_seconds_bucket[5m])) > 5
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Indexer RPC latency p99 >5s — Base chain RPC degraded"
        noDataState: OK

      - uid: p1-rtp-player-anomalies
        title: "P1: Multiple players with anomalous RTP"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: coinpusher_rtp_player_anomaly_count > 3
              instant: true
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        labels:
          severity: P1
        annotations:
          summary: ">3 players with anomalous RTP detected — possible coordinated exploit"
        noDataState: OK

      - uid: p1-heat-zero-players
        title: "P1: Heat engine shows 0 active players during game activity"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(coinpusher_batch_insert_coins_total[5m]) > 0 and coinpusher_heat_active_players == 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Players inserting coins but heat engine shows 0 active — rewards not distributing"
        noDataState: OK

      - uid: p1-indexer-poll-errors-sustained
        title: "P1: Indexer poll errors sustained"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(coinpusher_indexer_poll_errors_total[5m]) > 5
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Indexer poll errors sustained — deposits may be delayed"
        noDataState: OK

      # --- RPC per-provider degradation (added 2026-04-24) ---
      # Fires when a specific provider is failing >30% of calls over 10min.
      # Fallback is absorbing the impact but the degraded provider should
      # be investigated / swapped before other providers also degrade.

      - uid: p1-rpc-provider-degraded
        title: "P1: RPC provider degraded (fallback absorbing)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              # Only rate-limit, timeout, and network errors count as
              # "degraded" — `result="other"` includes app-level things
              # like CallContract reverts and nonce-rejections that don't
              # indicate provider health.
              expr: (sum by (service, provider) (rate(coinpusher_rpc_attempts_total{result=~"rate_limited|timeout|network"}[10m]))) / (sum by (service, provider) (rate(coinpusher_rpc_attempts_total[10m]))) > 0.3
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 10m
        labels:
          severity: P1
        annotations:
          summary: "RPC provider failure rate >30% for 10min — fallback is carrying load, investigate before other providers also degrade"
        noDataState: OK

      - uid: p1-executor-rpc-fallback-active
        title: "P1: Executor using fallback RPC provider"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              # Fires only when Alchemy (primary) ok-rate is zero AND Ankr
              # (fallback) ok-rate > 0. The `or on() vector(0)` guards the
              # alchemy series: if Alchemy isn't configured at all there's
              # no series, which would otherwise leave the expression
              # empty (alert never fires). The providers-configured alert
              # below catches the "alchemy entirely missing" case.
              expr: ((sum(rate(coinpusher_rpc_attempts_total{service="executor",provider="alchemy",result="ok"}[5m])) or on() vector(0)) == 0) and (sum(rate(coinpusher_rpc_attempts_total{service="executor",provider="ankr",result="ok"}[5m])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Executor is successfully using Ankr (fallback) for 5min while Alchemy (primary) has zero ok-rate — investigate primary"
        noDataState: OK

      - uid: p1-rpc-providers-degraded-set
        title: "P1: RPC provider set degraded at startup"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              # Fires when fewer providers dialed successfully than were
              # configured (e.g., an env var went missing or a URL is bad).
              # This is the exact "container Up, actually broken" pattern:
              # service is running but with reduced redundancy and no other
              # signal until the remaining providers also fail.
              expr: coinpusher_rpc_providers_configured < coinpusher_rpc_providers_intended
              instant: true
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "RPC provider set degraded on {{ $labels.service }} — fewer providers dialed than configured. Check env vars and provider URLs."
        noDataState: OK

      # --- Per-user RTP exploitation (added 2026-05-08) ---
      # Fires when at least one real user has 24h RTP > 100% with >= 100
      # coins inserted. RTP > 100% means the user is extracting more cash
      # via heat distribution than they invested via inserts — exactly the
      # leak class the c1505470 incident exposed. The 100-coin floor
      # filters drive-by noise (visit-once users with tiny inserts that
      # naturally have wide RTP variance). Investigate immediately and
      # consider flipping bot kill_switch=on if exploitation confirmed.
      # See docs/runbooks/bot-reenable.md for response procedure.

      - uid: p1-real-user-rtp-over-100pct
        title: "P1: Real user RTP > 100% over 24h"
        condition: C
        data:
          - refId: A
            # SQL uses its own NOW() - INTERVAL '24 hours', so this range
            # only matters to Grafana's validator. Use 600s nominal.
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: postgres
            model:
              format: table
              rawSql: |
                WITH activity AS (
                  SELECT a.account_id,
                    SUM(CASE WHEN al.action_type = 'GAME_INSERT' THEN al.amount ELSE 0 END) AS coins_inserted,
                    SUM(CASE WHEN al.action_type = 'GAME_REWARD' AND al.currency = 'CASH' THEN al.amount ELSE 0 END) AS cash_earned
                  FROM accounting_logs al
                  JOIN accounts a ON a.account_id = al.account_id
                  WHERE al.created_at > NOW() - INTERVAL '24 hours'
                    AND a.role NOT IN ('bot','admin')
                  GROUP BY a.account_id
                )
                SELECT COUNT(*)::int AS leaks
                FROM activity
                WHERE coins_inserted >= 100 AND cash_earned > coins_inserted
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Real user RTP > 100% over 24h — heat-formula exploitation suspected. Investigate via Economy RTP dashboard. If confirmed, flip `admin bot kill-switch on` immediately and post-mortem before re-enabling. Runbook: docs/runbooks/bot-reenable.md"
        noDataState: OK


