apiVersion: 1

policies:
  - orgId: 1
    receiver: telegram
    group_by: ["grafana_folder", "alertname"]
    routes:
      - receiver: telegram
        matchers:
          - severity = P0
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 15m
      - receiver: telegram
        matchers:
          - severity = P1
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
      - receiver: telegram
        matchers:
          - severity = P2
        group_wait: 1m
        group_interval: 15m
        repeat_interval: 8h
