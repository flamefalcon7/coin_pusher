global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "backend"
    static_configs:
      - targets: ["backend:4010"]
    metrics_path: /metrics

  # NOTE: NATS /varz returns JSON, not Prometheus format.
  # Use nats-exporter if NATS metrics are needed in Prometheus.

  - job_name: "indexer"
    static_configs:
      - targets: ["indexer:9091"]
    metrics_path: /metrics

  - job_name: "executor"
    static_configs:
      - targets: ["executor:9092"]
    metrics_path: /metrics

  # The game server runs on a SEPARATE droplet, so there is no Docker DNS name
  # for it the way there is for backend/indexer/executor above — it has to be
  # reached over the VPC by address. Prometheus does not support env var
  # substitution, so the address is committed rather than templated.
  #
  # This was a REPLACE_WITH_GAME_VPC_IP placeholder until 2026-08-05, while the
  # running container held the real value. Recreating Prometheus from git would
  # have resolved the literal placeholder, failed, and silently dropped every
  # game-server metric — including the tick-breaker counters. Keep it a real
  # address. If the game droplet is ever rebuilt, get the new one with
  # `ip addr show eth1` on that box and update this line.
  - job_name: "game"
    static_configs:
      - targets: ["10.104.0.2:9100"]
    metrics_path: /metrics
